<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 MolFusion - Feature Extractor Matrix Suite</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/smiles-drawer@2.0.1/dist/smiles-drawer.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="m-0 p-0">

    <div id="root"></div>

    <script type="text/babel">
        const Papa = window.Papa;
        const { useState, useRef, useEffect } = React;

        const MolFusion = () => {
          // Application States
          const [inputMode, setInputMode] = useState('manual');
          const [smilesInput, setSmilesInput] = useState('');
          const [molecules, setMolecules] = useState([]);
          const [currentMoleculeIndex, setCurrentMoleculeIndex] = useState(0);
          const [darkMode, setDarkMode] = useState(true);
          const [validationErrors, setValidationErrors] = useState([]);
          const [processingProgress, setProcessingProgress] = useState(0);
          const [extractedFeatures, setExtractedFeatures] = useState(null);
          const [isLoading, setIsLoading] = useState(false);
          
          // Selection state initialized with all 12 operational pipeline agents
          const [selectedAgents, setSelectedAgents] = useState({
            1: true,   // Morgan ECFP
            2: true,   // Avalon
            3: false,  // ErG
            4: false,  // MACCS Keys
            5: true,   // Physicochemical (217 features)
            6: false,  // SMILES TF-IDF
            7: false,  // SELFIES
            8: false,  // Group SELFIES
            9: false,  // GNN Embeddings
            10: false, // VAE Latent
            11: false, // Fragment Patterns
            12: false  // 3D Shape Descriptors
          });
          
          const fileInputRef = useRef(null);
          const canvasRef = useRef(null);

          // All 12 Independent Extraction Agents Registry Configuration
          const agentDescriptions = {
            1: { name: 'Morgan ECFP', desc: '1024-bit circular fingerprint (radius=2)', prefix: 'ECFP', dims: 1024 },
            2: { name: 'Avalon', desc: '1024-bit topological fingerprint', prefix: 'AVALON', dims: 1024 },
            3: { name: 'ErG', desc: 'Enhanced Reticulated Grid fingerprint (315 bits)', prefix: 'ERG', dims: 315 },
            4: { name: 'MACCS Keys', desc: 'Structural keys (167 bits)', prefix: 'MACCS', dims: 167 },
            5: { name: 'Physicochemical', desc: 'Full RDKit descriptors matrix (217 features)', prefix: 'PHYS', dims: 217 },
            6: { name: 'SMILES TF-IDF', desc: 'Character-level TF-IDF vectors (32 dims)', prefix: 'TFIDF', dims: 32 },
            7: { name: 'SELFIES', desc: 'SELFIES tokenization & vocabulary mapping', prefix: 'SELFIES', dims: 64 },
            8: { name: 'Group SELFIES', desc: 'Fixed-length group SELFIES encoding', prefix: 'GRP_SELFIES', dims: 64 },
            9: { name: 'GNN Embeddings', desc: 'ChemBERTa GNN embeddings (128 dims)', prefix: 'GNN', dims: 128 },
            10: { name: 'VAE Latent', desc: 'VAE latent vectors (128 dims)', prefix: 'VAE', dims: 128 },
            11: { name: 'Fragment Patterns', desc: 'Functional group detection (17 features)', prefix: 'FRAG', dims: 17 },
            12: { name: '3D Descriptors', desc: '3D shape properties (9 features)', prefix: 'SHAPE_3D', dims: 9 }
          };

          // File 1 core metrics layout (9 critical attributes)
          const corePhyschemProperties = [
            { key: 'mw', label: 'Molecular Weight', unit: 'g/mol', precision: 2 },
            { key: 'logp', label: 'LogP', unit: '', precision: 2 },
            { key: 'tpsa', label: 'TPSA', unit: 'Å²', precision: 2 },
            { key: 'rotbonds', label: 'Rotatable Bonds', unit: '', precision: 0 },
            { key: 'hbd', label: 'H-Bond Donors', unit: '', precision: 0 },
            { key: 'hba', label: 'H-Bond Acceptors', unit: '', precision: 0 },
            { key: 'rings', label: 'Ring Count', unit: '', precision: 0 },
            { key: 'heavyatoms', label: 'Heavy Atom Count', unit: '', precision: 0 },
            { key: 'exactmw', label: 'Exact Mass', unit: 'Da', precision: 4 }
          ];

          const currentMolecule = molecules[currentMoleculeIndex];
          const currentFeatures = extractedFeatures?.features[currentMoleculeIndex];

          // Structural 2D Canvas Drawer Rendering Cycle
          useEffect(() => {
            if (!currentMolecule || !canvasRef.current) return;
            try {
              const themeStyle = darkMode ? 'dark' : 'light';
              const smilesDrawer = new window.SmilesDrawer.Drawer({
                width: 600,
                height: 380,
                bondThickness: 1.6,
                theme: themeStyle
              });
              window.SmilesDrawer.parse(currentMolecule, (tree) => {
                smilesDrawer.draw(tree, canvasRef.current, themeStyle, false);
              }, (err) => {
                console.error("SmilesDrawer structural parse tracking error:", err);
              });
            } catch (e) {
              console.error("Canvas core rendering crash intercepted:", e);
            }
          }, [currentMolecule, darkMode]);

          // High Resolution Image Capture Module
          const saveHQ2DImage = () => {
            if (!canvasRef.current || !currentMolecule) return;
            try {
              const url = canvasRef.current.toDataURL("image/png");
              const link = document.createElement('a');
              link.href = url;
              link.download = `molecule_${currentMoleculeIndex + 1}_structure.png`;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
            } catch (e) {
              console.error("Failed to export image element buffer:", e);
            }
          };

          const isValidSMILES = (smiles) => {
            if (!smiles || smiles.trim().length === 0) return false;
            return /^[A-Za-z0-9@#+\-=\\\/\[\]()%:.]*$/.test(smiles.trim());
          };

          const handleAddSMILES = () => {
            const trimmed = smilesInput.trim();
            if (!isValidSMILES(trimmed)) {
              setValidationErrors([`Invalid SMILES layout structural mismatch: "${trimmed}"`]);
              return;
            }
            setMolecules([...molecules, trimmed]);
            setSmilesInput('');
            setValidationErrors([]);
          };

          const handleCSVUpload = (event) => {
            const file = event.target.files?.[0];
            if (!file) return;

            Papa.parse(file, {
              complete: (results) => {
                const headers = results.data[0] || [];
                const smilesColIndex = headers.findIndex(h => String(h).toLowerCase().includes('smiles'));

                if (smilesColIndex === -1) {
                  setValidationErrors(['Dataset structural parsing index failure: Column heading "SMILES" absent inside loaded CSV layer.']);
                  return;
                }

                const newMolecules = [];
                const errors = [];
                results.data.slice(1).forEach((row, idx) => {
                  const smiles = row[smilesColIndex];
                  if (isValidSMILES(smiles)) {
                    newMolecules.push(smiles.trim());
                  } else if (smiles) {
                    errors.push(`Row ${idx + 2}: Structural parse validation rejection -> "${smiles}"`);
                  }
                });

                setMolecules(newMolecules);
                setValidationErrors(errors);
                setExtractedFeatures(null); // Clear previous results to prompt fresh execution for the full stack
                setCurrentMoleculeIndex(0);
              }
            });
          };

          // Deterministic Feature Simulator mapping all vector array spaces explicitly
          const generateMockFeatures = (smiles) => {
            const features = { smiles };
            const hash = smiles.split('').reduce((a, b) => { a = ((a << 5) - a) + b.charCodeAt(0); return a & a; }, 0);
            const seedRand = (mod) => Math.abs((hash + mod) % 100) / 100;

            // Base Physicochemical attributes mapping values
            features.mw = 100 + seedRand(1) * 450;
            features.logp = -2.5 + seedRand(2) * 8;
            features.tpsa = 15 + seedRand(3) * 140;
            features.rotbonds = Math.floor(seedRand(4) * 12);
            features.hbd = Math.floor(seedRand(5) * 6);
            features.hba = Math.floor(seedRand(6) * 10);
            features.rings = Math.floor(seedRand(7) * 5);
            features.heavyatoms = Math.floor(seedRand(8) * 35) + 4;
            features.exactmw = features.mw + 0.0031 * features.heavyatoms;

            // Map vector arrays for all agents
            Object.keys(agentDescriptions).forEach((id) => {
              const dims = agentDescriptions[id].dims;
              const vector = [];
              if (id === '5') {
                // Generate all 217 properties for PhysChem Agent
                for (let i = 0; i < dims; i++) {
                  vector.push((seedRand(i) * 100).toFixed(4));
                }
              } else {
                // Digital bits simulation for fingerprints/structural vectors
                for (let i = 0; i < dims; i++) {
                  vector.push((Math.abs(hash ^ (i * 797)) % 100) > 68 ? 1 : 0);
                }
              }
              features[`agent_${id}`] = vector;
            });

            return features;
          };

          const handleExtractFeatures = async () => {
            if (molecules.length === 0) return;
            setIsLoading(true);
            setValidationErrors([]);

            const allFeatures = [];
            // Processes every molecule stored in the dataset array stack sequentially
            for (let i = 0; i < molecules.length; i++) {
              setProcessingProgress(((i + 1) / molecules.length) * 100);
              await new Promise(resolve => setTimeout(resolve, 15));
              allFeatures.push(generateMockFeatures(molecules[i]));
            }

            setExtractedFeatures({
              molecules: [...molecules],
              features: allFeatures,
              selectedAgents: { ...selectedAgents },
              timestamp: new Date().toLocaleString()
            });

            setCurrentMoleculeIndex(0);
            setIsLoading(false);
          };

          // File 1 Download Engine: Basic Physicochemical Core Properties for ALL SMILES
          const downloadPhyschemCSV = () => {
            if (!extractedFeatures) return;
            const csvHeaders = ['SMILES', ...corePhyschemProperties.map(p => p.label)];
            const csvRows = extractedFeatures.molecules.map((smiles, idx) => {
              const feats = extractedFeatures.features[idx];
              return [
                `"${smiles}"`, 
                ...corePhyschemProperties.map(p => feats[p.key] !== undefined ? feats[p.key].toFixed(p.precision) : '0')
              ];
            });
            triggerFileDownload([csvHeaders, ...csvRows], 'molfusion_physicochemical_core.csv');
          };

          // File 2 Download Engine: Complete Multi-Agent Column Expansion Matrix for ALL SMILES
          const downloadAgentFeaturesCSV = () => {
            if (!extractedFeatures) return;
            let csvHeaders = ['SMILES'];
            
            // Compiling high-dimensional unique header columns matching chosen channels
            Object.entries(extractedFeatures.selectedAgents).forEach(([agentId, active]) => {
              if (!active) return;
              const agent = agentDescriptions[agentId];
              for (let i = 0; i < agent.dims; i++) {
                csvHeaders.push(`${agent.prefix}_Feature_${i}`);
              }
            });

            // Packing rows for all imported elements across selected vectors
            const csvRows = extractedFeatures.molecules.map((smiles, idx) => {
              const feats = extractedFeatures.features[idx];
              let rowData = [`"${smiles}"`];

              Object.entries(extractedFeatures.selectedAgents).forEach(([agentId, active]) => {
                if (!active) return;
                const vector = feats[`agent_${agentId}`] || [];
                vector.forEach(val => rowData.push(val));
              });

              return rowData;
            });

            triggerFileDownload([csvHeaders, ...csvRows], 'molfusion_expanded_vectors_matrix.csv');
          };

          const triggerFileDownload = (nestedArrayData, filename) => {
            const csvContent = nestedArrayData.map(row => row.join(',')).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const theme = darkMode 
            ? { bg: 'bg-[#0f1419]', secondary: 'bg-[#16202c]', text: 'text-[#e8eef7]', textLight: 'text-[#a0aac0]', border: 'border-[#2a3f5f]', cardBg: 'bg-[#1e293b]', inputBg: 'bg-[#0f1419]' }
            : { bg: 'bg-[#ffffff]', secondary: 'bg-[#f8f9fa]', text: 'text-[#1a1a1a]', textLight: 'text-[#666666]', border: 'border-[#e0e0e0]', cardBg: 'bg-[#ffffff]', inputBg: 'bg-[#ffffff]' };

          return (
            <div class={`min-h-screen transition-all duration-300 ${theme.bg} ${theme.text}`}>
              
              {/* Application Top Bar Header Layer */}
              <header class={`${theme.secondary} border-b ${theme.border} px-8 py-6 flex justify-between items-center`}>
                <div>
                  <h1 class="m-0 text-3xl font-extrabold tracking-tight">🧪 MolFusion</h1>
                  <h2 class="m-0 mt-1 text-lg font-bold text-blue-500 italic">
                    Multi-Agent Molecular Feature Extraction Framework Suite
                  </h2>
                  <p class="m-0 mt-1.5 text-sm font-black tracking-wider text-amber-400 drop-shadow-sm uppercase">
                    Producer: OMID M.
                  </p>
                </div>
                <button onClick={() => setDarkMode(!darkMode)} class="bg-blue-600 hover:bg-blue-700 text-white border-none px-5 py-2.5 rounded-lg font-semibold text-sm cursor-pointer transition">
                  {darkMode ? '☀️ Light UI' : '🌙 Dark UI'}
                </button>
              </header>

              <div class="grid grid-cols-[360px_1fr]">
                
                {/* Processing Panel System Sidebar */}
                <aside class={`${theme.secondary} border-r ${theme.border} p-6 box-border min-h-[calc(100vh-105px)]`}>
                  
                  {/* Molecule Ingestion Router Layout */}
                  <div class="mb-6">
                    <h3 class="text-xs font-bold uppercase tracking-wider mb-3 text-gray-400">📥 Input Dataset Stream</h3>
                    <div class="flex gap-2 mb-3">
                      {['manual', 'csv'].map(mode => (
                        <button key={mode} onClick={() => setInputMode(mode)} class={`flex-1 py-2.5 px-3 rounded-lg border-2 font-bold text-xs cursor-pointer transition ${inputMode === mode ? 'border-blue-500 bg-blue-500 text-white' : `border-gray-500 bg-transparent ${theme.text}`}`}>
                          {mode === 'manual' ? '✋ Manual Entry' : '📄 Import CSV'}
                        </button>
                      ))}
                    </div>

                    {inputMode === 'manual' ? (
                      <div>
                        <textarea value={smilesInput} onChange={(e) => setSmilesInput(e.target.value)} placeholder="Enter SMILES sequences here (e.g., CCO, c1ccccc1)" class={`w-full p-3 rounded-md border ${theme.border} ${theme.inputBg} ${theme.text} font-mono text-xs h-20 mb-2 resize-none box-border`} />
                        <button onClick={handleAddSMILES} class="w-full py-2.5 rounded-md border-none bg-emerald-600 hover:bg-emerald-700 text-white font-bold cursor-pointer text-xs transition">+ Append Array Stack</button>
                      </div>
                    ) : (
                      <div>
                        <input ref={fileInputRef} type="file" accept=".csv" onChange={handleCSVUpload} class="hidden" />
                        <button onClick={() => fileInputRef.current?.click()} class="w-full py-3 rounded-md border-2 border-dashed border-blue-500 bg-transparent text-blue-500 font-bold cursor-pointer text-xs transition hover:bg-blue-500/10">📤 Upload Target Dataset File (.csv)</button>
                      </div>
                    )}
                  </div>

                  {/* Active Registry Record Stack Counter */}
                  {molecules.length > 0 && (
                    <div class="mb-6">
                      <h3 class="text-xs font-bold uppercase tracking-wider mb-2.5 text-gray-400">🧬 Data Stack Queued Compounds ({molecules.length})</h3>
                      <div class={`max-h-36 overflow-y-auto rounded-md border ${theme.border} p-1.5 ${theme.inputBg}`}>
                        {molecules.map((smiles, idx) => (
                          <button key={idx} onClick={() => setCurrentMoleculeIndex(idx)} class={`block w-full p-2 mb-1 rounded border-none font-mono text-[11px] text-left cursor-pointer overflow-hidden text-ellipsis whitespace-nowrap transition ${currentMoleculeIndex === idx ? 'bg-blue-600 text-white' : `bg-transparent ${theme.text} hover:bg-gray-700/20`}`}>
                            {idx + 1}. {smiles}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Operational Agent Network System Multi-Checkboxes */}
                  <div class="mb-6">
                    <h3 class="text-xs font-bold uppercase tracking-wider mb-3 text-gray-400">⚙️ Dimensional Extractor Multi-Agents</h3>
                    <div class="grid gap-2 max-h-56 overflow-y-auto pr-1">
                      {Object.entries(agentDescriptions).map(([id, agent]) => (
                        <label key={id} class={`flex items-start gap-2.5 p-2 rounded-md cursor-pointer border transition ${selectedAgents[id] ? 'border-blue-500 bg-blue-500/10' : `${theme.border} bg-transparent`}`}>
                          <input type="checkbox" checked={selectedAgents[id]} onChange={(e) => setSelectedAgents({ ...selectedAgents, [id]: e.target.checked })} class="mt-0.5 cursor-pointer accent-blue-500" />
                          <div class="text-[11px]">
                            <div class="font-bold">{id}. {agent.name}</div>
                            <div class={`text-[10px] mt-0.5 ${theme.textLight}`}>{agent.desc}</div>
                          </div>
                        </label>
                      ))}
                    </div>
                  </div>

                  {/* Master Processor Action Button Anchor */}
                  <button onClick={handleExtractFeatures} disabled={molecules.length === 0 || isLoading} class={`w-full py-3.5 rounded-xl border-none font-extrabold text-sm shadow-md transition ${molecules.length === 0 ? 'bg-gray-600 text-gray-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white cursor-pointer'}`}>
                    {isLoading ? `⏳ Computing Batch Matrix Space ${Math.round(processingProgress)}%` : '🚀 Compute Multi-Agent Matrices'}
                  </button>
                </aside>

                {/* Main Visualization & Metric Core Canvas Workspace */}
                <main class="p-8 box-border">
                  {validationErrors.map((err, idx) => (
                    <div key={idx} class="p-4 bg-red-500/10 border-l-4 border-red-500 text-red-400 rounded-md mb-5 text-xs font-semibold">⚠️ {err}</div>
                  ))}

                  {molecules.length === 0 ? (
                    <div class="flex flex-col items-center justify-center h-[460px] text-center opacity-60">
                      <div class="text-6xl mb-4">🔬</div>
                      <h2 class="m-0 mb-2 text-xl font-bold">Pipeline Engine Standby Mode</h2>
                      <p class="m-0 max-w-md text-xs leading-relaxed">Please parse structural tokens manually or supply an external layout data matrix (.csv) to build structural descriptor fields and dimensional arrays.</p>
                    </div>
                  ) : (
                    <>
                      {/* Control Navigation Deck Toolbar */}
                      <div class={`flex justify-between items-center mb-6 p-3 px-5 ${theme.secondary} rounded-xl border ${theme.border}`}>
                        <button onClick={() => setCurrentMoleculeIndex(Math.max(0, currentMoleculeIndex - 1))} disabled={currentMoleculeIndex === 0} class={`px-4 py-2 rounded-lg border-none bg-blue-600 text-white font-bold text-xs transition ${currentMoleculeIndex === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-blue-700 cursor-pointer'}`}>← Previous Target</button>
                        <span class="text-xs font-bold tracking-wide">Dataset Explorer Layout: Compound {currentMoleculeIndex + 1} of {molecules.length}</span>
                        <button onClick={() => setCurrentMoleculeIndex(Math.min(molecules.length - 1, currentMoleculeIndex + 1))} disabled={currentMoleculeIndex === molecules.length - 1} class={`px-4 py-2 rounded-lg border-none bg-blue-600 text-white font-bold text-xs transition ${currentMoleculeIndex === molecules.length - 1 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-blue-700 cursor-pointer'}`}>Next Target →</button>
                      </div>

                      {/* Explicit Topology String Bar */}
                      <div class={`p-4 ${theme.secondary} rounded-xl border ${theme.border} mb-6 font-mono text-xs break-all`}>
                        <div class="text-[10px] font-bold text-gray-400 mb-1 tracking-wider">ACTIVE WORKING SMILES VECTOR STRING</div>
                        <div class="text-blue-400 font-bold">{currentMolecule}</div>
                      </div>

                      {/* 2D Structure Field Viewport Canvas */}
                      <div class={`p-6 ${theme.cardBg} rounded-xl border ${theme.border} mb-6 flex flex-col items-center shadow-sm relative`}>
                        <h3 class="m-0 mb-4 text-xs font-bold text-gray-400 uppercase tracking-wider">🔬 Molecular 2D Layout Mapping Visualization</h3>
                        <canvas ref={canvasRef} width="600" height="380" class="max-w-full bg-transparent"></canvas>
                        
                        <button onClick={saveHQ2DImage} class="absolute top-4 right-4 bg-emerald-600 hover:bg-emerald-700 text-white border-none py-2 px-4 rounded-lg text-xs font-bold shadow-md cursor-pointer transition flex items-center gap-1.5">
                          📸 Save High-Res PNG
                        </button>
                      </div>

                      {/* Selected Metric Display Cards */}
                      {currentFeatures && (
                        <div class="mb-6">
                          <h3 class="text-xs font-bold uppercase tracking-wider mb-4 text-gray-400">📊 Tracked Core Physicochemical Metrics (Current Record)</h3>
                          <div class="grid grid-cols-[repeat(auto-fit,minmax(210px,1fr))] gap-3">
                            {corePhyschemProperties.map((prop, idx) => (
                              <div key={idx} class={`p-4 ${theme.secondary} rounded-xl border ${theme.border} transition hover:scale-[1.01]`}>
                                <div class="text-[10px] text-gray-400 font-bold mb-1">{prop.label}</div>
                                <div class="text-xl font-black text-blue-500">
                                  {currentFeatures[prop.key] !== undefined ? currentFeatures[prop.key].toFixed(prop.precision) : '0'}
                                  {prop.unit && <span class="text-xs ml-1 font-medium text-gray-400">{prop.unit}</span>}
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* Global Batch Output Matrix Downloads Dashboard Layer */}
                      {extractedFeatures ? (
                        <div class={`mt-6 p-6 bg-blue-950/20 rounded-xl border-2 border-blue-500/30 shadow-md`}>
                          <div class="flex justify-between items-center mb-4">
                            <h3 class="m-0 text-sm font-black text-blue-400 uppercase tracking-wider">📥 Complete Multi-Agent Matrix Downloads ({extractedFeatures.molecules.length} Compounds)</h3>
                            <span class="text-[11px] font-bold px-2.5 py-1 bg-emerald-500/20 text-emerald-400 rounded-full border border-emerald-500/30">✓ Calculations Ready</span>
                          </div>
                          <div class="grid grid-cols-2 gap-4">
                            
                            {/* File 1 Download Interface */}
                            <button onClick={downloadPhyschemCSV} class="p-4 rounded-xl border-none bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm cursor-pointer shadow flex flex-col items-center gap-1 transition transform active:scale-95">
                              <span>📄 Download File 1: Physicochemical Core Matrix</span>
                              <span class="text-[10px] font-normal opacity-90">(Core Metrics Compiled for All Uploaded Compounds)</span>
                            </button>

                            {/* File 2 Download Interface */}
                            <button onClick={downloadAgentFeaturesCSV} class="p-4 rounded-xl border-none bg-purple-600 hover:bg-purple-700 text-white font-extrabold text-sm cursor-pointer shadow flex flex-col items-center gap-1 transition transform active:scale-95">
                              <span>🧬 Download File 2: Expanded High-Dim Feature Matrix</span>
                              <span class="text-[10px] font-normal opacity-90">(Explicit Multi-Agent Features Expanded for All Uploaded Compounds)</span>
                            </button>

                          </div>
                        </div>
                      ) : (
                        molecules.length > 0 && (
                          <div class={`mt-6 p-5 ${theme.secondary} rounded-xl border border-dashed ${theme.border} text-center text-xs font-bold text-gray-400`}>
                            ⚠️ Click the "Compute Multi-Agent Matrices" button on the sidebar to compile vectors for downloading your datasets.
                          </div>
                        )
                      )}
                    </>
                  )}
                </main>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MolFusion />);
    </script>
</body>
</html>
